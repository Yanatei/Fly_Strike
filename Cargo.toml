[package]
name = "Fly_Strike"
version = "0.1.0"
edition = "2024"

[dependencies]
#增加调试信息，打印错误时会打印对象名称
#bevy = {version = "0.18.0", features = ["debug","wav"]}
bevy = {version = "0.18.0", features = ["wav"]}
bevy_hanabi = "0.18.0"
rand = "0.9.2"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "Fly_Strike"
path = "src/main.rs"
#required-features = ["desktop"]

#[features]
#desktop = []

[package.metadata.android]
build_targets = ["aarch64-linux-android"]
target_sdk_version = 35
min_sdk_version = 21